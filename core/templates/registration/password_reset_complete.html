{% extends 'base.html' %}
{% load static %}

{% block title %}Password Berhasil Diubah - Mbayar POS{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0">
                        <i class="fas fa-check-circle me-2"></i>
                        Password Berhasil Diubah
                    </h5>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="fas fa-lock-open fa-4x text-success mb-3"></i>
                    
                    <h5 class="mb-3">Password Anda Telah Diubah!</h5>
                    
                    <p class="text-muted mb-4">
                        Password Anda berhasil diubah. Silakan login dengan password baru Anda.
                    </p>
                    
                    <a href="{% url 'login' %}" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Login Sekarang
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
