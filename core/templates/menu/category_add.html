     FITUR:
       - Form input nama kategori
       - Textarea deskripsi
       - Tombol simpan dan batal

     UPDATE TERAKHIR: Initial implementation
     ================================================== -->

{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Tambah Kategori Menu - Mbayar POS{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- ===== HEADER ===== -->
    <div class="row mb-3">
        <div class="col">
            <h2>Tambah Kategori Menu</h2>
        </div>
    </div>

    <!-- ===== FORM ===== -->
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Nama Kategori</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Deskripsi</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a href="{% url 'menu_category_list' %}" class="btn btn-secondary">Batal</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
